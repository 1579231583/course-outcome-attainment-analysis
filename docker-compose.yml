services:
  mysql:
    image: mysql:8.0
    container_name: obe-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-obe_root_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-obe_attainment}
      MYSQL_USER: ${MYSQL_USER:-obe_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-obe_pass_2026}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-obe_root_2026}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: obe-attainment-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-obe_user}:${MYSQL_PASSWORD:-obe_pass_2026}@mysql:3306/${MYSQL_DATABASE:-obe_attainment}
      OBE_TOKEN_SECRET: ${OBE_TOKEN_SECRET:-obe-course-attainment-jwt-secret-2026}
    ports:
      - "${APP_PORT:-8000}:8000"

volumes:
  mysql_data:
