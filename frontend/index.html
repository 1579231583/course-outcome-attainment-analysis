<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课程目标达成度分析系统</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>课程目标达成度分析系统</h1>
  <p class="sub">配置 → 下载模板 → 上传成绩 → 查看达成度</p>
</header>

<main>
  <!-- 步骤 1：配置 -->
  <section class="card">
    <h2><span class="step">1</span>成绩评定方法</h2>
    <div class="row">
      <label>平时占比 <input id="dailyRatio" type="number" step="0.01" value="0.4"></label>
      <label>期末占比 <input id="finalRatio" type="number" step="0.01" value="0.6"></label>
    </div>
    <h3>平时环节（占比之和须为 1）</h3>
    <table id="dailyTable">
      <thead><tr><th>环节名称</th><th>占比</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <button class="btn ghost" onclick="addDaily()">+ 添加环节</button>
    <p class="hint" id="dailySum"></p>
  </section>

  <section class="card">
    <h2><span class="step">2</span>课程目标与考核环节对应关系</h2>
    <p class="hint">填写大纲中各目标在各环节的原始比例，系统会自动列归一化。</p>
    <div class="scroll"><table id="matrixTable"></table></div>
  </section>

  <section class="card">
    <h2><span class="step">3</span>试卷结构</h2>
    <p class="hint">大题 → 小题，每题满分与所属课程目标。总分须为 100。</p>
    <div id="paperArea"></div>
    <button class="btn ghost" onclick="addGroup()">+ 添加大题</button>
    <p class="hint" id="paperSum"></p>
  </section>

  <section class="card">
    <h2><span class="step">4</span>保存配置并下载模板</h2>
    <button class="btn primary" onclick="saveConfig()">保存配置</button>
    <a class="btn ghost" href="/api/template/daily">下载平时成绩模板</a>
    <a class="btn ghost" href="/api/template/final">下载期末小题模板</a>
    <p class="hint" id="saveMsg"></p>
  </section>

  <section class="card">
    <h2><span class="step">5</span>上传成绩并计算</h2>
    <div class="row">
      <label>平时成绩表 <input id="dailyFile" type="file" accept=".xlsx"></label>
      <label>期末小题成绩表 <input id="finalFile" type="file" accept=".xlsx"></label>
    </div>
    <button class="btn primary" onclick="calculate()">开始计算</button>
    <p class="hint" id="calcMsg"></p>
  </section>

  <section class="card" id="resultCard" style="display:none">
    <h2>计算结果</h2>
    <div id="resultArea"></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
